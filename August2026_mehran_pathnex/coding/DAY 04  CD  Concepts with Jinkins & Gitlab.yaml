Day 04 - Basic CI/CD Concepts with Jinkins & Gitlab


 Jinkinsfile - Basic CI Pipeline
 Pipeline {
 stages {
 stage ('build') {
 steps {
 echo "building project'
 }
 }
 stage('test') {
 steps {
 echo 'running tests'
 }
 }
 stage('Deploy') {
 steps {
 echo 'deploying application'
 }
 }
 }
 }
 
 
 
  Gitlab CI/CD - basic Pipeline
  stages:
  - build
  - test
  - deploy
  
  build: 
  stage: build
  scripr:
  - echo "building project"
  
  test:
  stage: test
  script:
  - echo "running tests"
  
 deploy:
 stage: deploy
 script:
 - echo "deploying application"


  Ansile - Install and Configure Nginx
  - name: Install and Configure Nginx
  Hosts: all
  become: yes
  tasks:
  - name: Install nginx
  yum:
  name:nginx
  state: present
  - name: configure nginx
  templete:
  src: nginx.conf.j2
  dest: /etc/nginx/nginx.conf
  - name: state nginx service
  service:
  name: nginx
  state: present
  enabled: yes


